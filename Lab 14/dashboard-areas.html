<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard Layout</title>

    <style>
        .dashboard {
            display: grid;
            grid-template-columns: 200px 1fr;
            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";
            gap: 10px;
        }

        .header {
            grid-area: header;
            background-color: navy;
            color: white;
            padding: 20px;
        }

        .sidebar {
            grid-area: sidebar;
            background-color: lightblue;
            padding: 20px;
        }

        .main {
            grid-area: main;
            background-color: lightgreen;
            padding: 20px;
        }

        .footer {
            grid-area: footer;
            background-color: gray;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h1>CSS Grid Dashboard</h1>

    <div class="dashboard">

        <header class="header">
            <h2>Dashboard Header</h2>
        </header>

        <aside class="sidebar">
            <h3>Sidebar</h3>
            <p>Home</p>
            <p>Profile</p>
            <p>Settings</p>
        </aside>

        <main class="main">
            <h3>Main Content</h3>
            <p>Welcome to my CSS Grid dashboard layout.</p>
        </main>

        <footer class="footer">
            <p>Dashboard Footer</p>
        </footer>

    </div>

</body>
</html>
