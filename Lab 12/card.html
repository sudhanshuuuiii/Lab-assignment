<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Card</title>

    <style>
        .card {
            background-color: lightblue;
            border: 2px solid navy;
            border-radius: 12px;
            padding: 16px;
            width: 300px;
        }
    </style>
</head>
<body>

    <h1>My Card</h1>

    <div class="card">
        <h3>Welcome to HTML and CSS</h3>
        <p>
            This is a simple card created using CSS.
            It demonstrates background colour, border,
            border radius and padding.
        </p>
    </div>

</body>
</html>
