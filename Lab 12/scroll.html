<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scrollable Area</title>

    <style>
        .scroll-box {
            height: 120px;
            overflow: auto;
            border: 2px solid black;
            padding: 10px;
            background-color: lightyellow;
        }
    </style>
</head>
<body>

    <h1>CSS Scrolling</h1>

    <div class="scroll-box">
        <p>Line 1</p>
        <p>Line 2</p>
        <p>Line 3</p>
        <p>Line 4</p>
        <p>Line 5</p>
    </div>

</body>
</html>
