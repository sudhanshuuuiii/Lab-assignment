<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Units</title>

    <style>
        .box-px {
            width: 200px;
            height: 40px;
            background-color: lightblue;
            margin-bottom: 10px;
        }

        .box-percent {
            width: 50%;
            height: 40px;
            background-color: lightgreen;
            margin-bottom: 10px;
        }

        p {
            font-size: 1.5rem;
        }
    </style>
</head>
<body>

    <h1>Understanding CSS Units</h1>

    <div class="box-px">200px Width Box</div>

    <div class="box-percent">50% Width Box</div>

    <p>This paragraph uses 1.5rem font size.</p>

</body>
</html>
