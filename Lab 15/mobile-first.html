<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mobile First Layout</title>

    <style>
        /* Mobile-first styling */
        .cards {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .card {
            background-color: lightblue;
            padding: 20px;
            border: 2px solid navy;
            border-radius: 10px;
        }

        /* Tablet and desktop styling */
        @media (min-width: 600px) {
            .cards {
                flex-direction: row;
            }

            .card {
                flex: 1;
            }
        }
    </style>
</head>
<body>

    <h1>Responsive Card Layout</h1>

    <div class="cards">

        <div class="card">
            <h2>Card One</h2>
            <p>This is the first responsive card.</p>
        </div>

        <div class="card">
            <h2>Card Two</h2>
            <p>This is the second responsive card.</p>
        </div>

    </div>

</body>
</html>
